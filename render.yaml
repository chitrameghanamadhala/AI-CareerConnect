# Render Blueprint Configuration for AI Career Connect
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-career-connect
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:app"
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.12
