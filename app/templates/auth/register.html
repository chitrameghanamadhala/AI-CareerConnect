<!--
templates/auth/register.html — Registration Page
===================================================
Why this file exists:
    Renders the registration form. Extends base.html.
-->
{% extends "base.html" %}

{% block title %}Register — AI Career Connect{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Start your AI-powered career journey</p>

        <form method="POST" action="{{ url_for('auth.register') }}" id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       placeholder="johndoe" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••" minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="register-button">
                Create Account
            </button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
